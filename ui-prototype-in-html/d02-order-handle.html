<!doctype html>
<html lang="zh-CN">

  <main class="screen">
    <div class="page-pad">
      <section class="card">
        <div class="card-head">
          <div>
            <h2 class="card-title">王小萌</h2>
            <p class="tiny" style="margin-top:3px;">138****6688</p>
          </div>
          <span class="pill-status pending">待确认</span>

        <div class="order-pet">
          <div class="avatar">🐶</div>

        <div style="margin-top:10px;">

      <section class="card">
        <div class="bill-table">
          <div class="bill-row"><span>备用接宠人</span><span>妈妈 138****6688</span></div>

        <div class="btn-row">
          <button class="btn btn-ghost" type="button">改价</button>
          <button class="btn btn-danger" type="button">拒绝</button>

        <p class="tiny" style="text-align:center; margin-top:12px;">拒绝必须填原因，客户会收到。</p>
