<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C02 我的宠物 · 萌宠之家 Petopia</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="preview">
<div class="phone" data-tab="pets">
  <header class="appbar">
    <h1 class="appbar-title">我的宠物</h1>
    <span class="appbar-note">2 只宝贝</span>
  </header>

  <main class="screen">
    <div class="page-pad">
      <p class="muted" style="margin:2px 0 14px;">档案越全，日报越懂它。</p>

      <section class="card">
        <div class="pet-card">
          <div class="avatar lg">🐶</div>
          <div class="pet-card-info">
            <div class="pet-card-name">豆豆 <span class="pill pill-neutral">金毛</span></div>
            <div class="pet-card-meta">12.5kg · ≥10kg 档</div>
            <div class="vaccine ok">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
              疫苗 2027-03-01 有效
            </div>
          </div>
          <a class="edit-link" href="c03-pet-profile.html">编辑</a>
        </div>
      </section>

      <section class="card">
        <div class="pet-card">
          <div class="avatar lg">🐱</div>
          <div class="pet-card-info">
            <div class="pet-card-name">花卷 <span class="pill pill-neutral">英短</span></div>
            <div class="pet-card-meta">4.2kg · &lt;10kg 档</div>
            <div class="vaccine warn">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.8"/><path d="M12 7.5V12l3 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
              疫苗 2026-12-20 将到期
            </div>
          </div>
          <a class="edit-link" href="c03-pet-profile.html">编辑</a>
        </div>
      </section>

      <a class="add-pet" href="c03-pet-profile.html">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        添加宠物
      </a>
    </div>
  </main>
</div>
<script src="ui.js"></script>
</body>
</html>
