<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D03 发日报 · 店主端 · 萌宠之家 Petopia</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="preview owner">
<div class="phone">
  <header class="appbar">
    <a class="appbar-back" href="d01-today.html" aria-label="返回">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m15 5-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <h1 class="appbar-title">发日报 <span class="appbar-sub">在店 3 只</span></h1>
    <span class="owner-pill">店主</span>
  </header>

  <main class="screen">
    <div class="page-pad">
      <div class="section-head" style="margin-top:8px;">
        <h2 class="section-title">豆豆 <span class="muted">（王小萌）</span></h2>
        <span class="pill pill-primary">1 / 3</span>
      </div>

      <section class="card">
        <div class="upload-row">
          <div class="upload-tile">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            加图
          </div>
          <div class="upload-tile">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            加图
          </div>
          <div class="upload-tile">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3.5" y="6" width="12" height="12" rx="3" stroke="currentColor" stroke-width="1.8"/><path d="m15.5 10 5-3v10l-5-3" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
            加视频
          </div>
        </div>
        <p class="tiny" style="margin-top:8px;">2 图或 2 视频，视频 ≤15 秒</p>
      </section>

      <div class="section">
        <p class="field-label" style="margin-bottom:8px;">模板</p>
        <div class="chip-row">
          <button class="chip active" type="button">吃得香</button>
          <button class="chip" type="button">想家</button>
          <button class="chip" type="button">开心</button>
        </div>
      </div>

      <div class="field section">
        <label class="field-label" for="daily-note">一句话 <span class="field-hint">可留空，直接发</span></label>
        <input class="input" id="daily-note" placeholder="今天吃得香，遛了两趟">
      </div>

      <div class="section">
        <button class="btn btn-primary btn-block" type="button" style="margin-top:0;">发送，下一只</button>
      </div>

      <section class="card" style="margin-top:14px;">
        <div class="card-head">
          <h2 class="card-title">已发</h2>
          <span class="pill pill-success">2 / 3</span>
        </div>
        <div class="bill-row"><span>花卷</span><span class="vaccine ok">✓ 已发</span></div>
        <div class="bill-row" style="margin-top:8px;"><span>大黄</span><span class="vaccine ok">✓ 已发</span></div>
      </section>
    </div>
  </main>
</div>
<script src="ui.js"></script>
</body>
</html>
