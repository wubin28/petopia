<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C01b 首页 · 未建档 · 萌宠之家 Petopia</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="preview">
<div class="phone" data-tab="home">
  <header class="appbar">
    <div class="appbar-brand">
      <img class="brand-mark" src="logo-mark.svg" alt="">
      <span class="brand-name">萌宠之家</span>
    </div>
    <span class="appbar-note"><span class="reply-dot"></span>小萌 · 2小时内回</span>
  </header>

  <main class="screen">
    <div class="page-pad">
      <section class="greeting">
        <div class="empty-art sm">🐾</div>
        <h1 class="greeting-title">你好呀</h1>
        <p class="greeting-sub">还没有寄养记录，先给宝贝建个档吧。</p>
      </section>

      <section class="card">
        <div class="card-head">
          <h2 class="card-title">建档只要 4 项</h2>
          <span class="pill pill-primary">约 1 分钟</span>
        </div>
        <div class="chip-row">
          <span class="chip">姓名</span>
          <span class="chip">品种</span>
          <span class="chip">体重</span>
          <span class="chip">疫苗本照片</span>
        </div>
        <p class="tiny" style="margin-top:12px; line-height:1.6;">先填这 4 项就能预约，其他信息到店再补。</p>
      </section>

      <a class="btn btn-primary btn-block" href="c03-pet-profile.html">添加宝贝信息</a>

      <section class="section">
        <div class="section-head">
          <h2 class="section-title">本周还剩 2 个位置</h2>
          <span class="section-note">11/08 – 11/10</span>
        </div>
        <div class="day-row">
          <div class="day-chip ok"><span class="day">11/08</span><span class="state">✓ 可订</span></div>
          <div class="day-chip full"><span class="day">11/09</span><span class="state">满</span></div>
          <div class="day-chip low"><span class="day">11/10</span><span class="state">剩 1</span></div>
        </div>
      </section>
    </div>
  </main>
</div>
<script src="ui.js"></script>
</body>
</html>
